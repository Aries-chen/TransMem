[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transmem"
version = "0.1.0"
description = "Topic-structured memory with adaptive transition expansion"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "diskcache>=5.6.3", "neo4j>=5.26,<6", "numpy>=1.26,<3",
  "openai>=1.91,<3", "posthog>=3,<8", "pydantic>=2.11,<3",
  "python-dotenv>=1", "tenacity>=9", "json-repair>=0.30",
  "spacy>=3.8,<3.9", "tiktoken>=0.9", "httpx>=0.27"
]

[project.scripts]
transmem = "transmem.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graphiti_core = ["py.typed"]
